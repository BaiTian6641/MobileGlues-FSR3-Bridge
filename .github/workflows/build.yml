name: Verify and build bridge JARs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare profile matrix
    runs-on: ubuntu-24.04
    outputs:
      profiles: ${{ steps.matrix.outputs.profiles }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: matrix
        shell: bash
        run: |
          echo "profiles=$(python3 -c 'import json; print(json.dumps([p["id"] for p in json.load(open("compatibility-lock.json"))["profiles"]]))')" >> "$GITHUB_OUTPUT"
  jars:
    name: ${{ matrix.profile }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.prepare.outputs.profiles) }}
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      SOURCE_DATE_EPOCH: '1767225600'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install checksum-pinned Temurin JDK 25
        shell: bash
        run: |
          archive="$RUNNER_TEMP/temurin-25.0.4.1+1.tar.gz"
          toolchain="$RUNNER_TEMP/temurin-25.0.4.1+1"
          curl --fail --location --proto '=https' --retry 3 \
            --output "$archive" \
            'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz'
          printf '%s  %s\n' 'dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e' "$archive" | sha256sum --check --strict -
          mkdir -p "$toolchain"
          tar --extract --gzip --file "$archive" --directory "$toolchain" --strip-components=1 --no-same-owner
          printf 'JAVA_HOME=%s\n' "$toolchain" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$toolchain" >> "$GITHUB_PATH"
          "$toolchain/bin/java" -version
          "$toolchain/bin/javac" -version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Verify ABI and build both Android native architectures
        run: python3 tools/build.py --profile '${{ matrix.profile }}'
      - name: Run host JNI, failure-state, mapping and packaging contracts
        run: python3 tools/test.py --profile '${{ matrix.profile }}'
      - name: Parse Java AST and inventory diagnostic boundaries
        run: |
          mkdir -p build/ast
          javac --release 17 -Xlint:all -Werror -d build/ast tools/JavaAstAudit.java
          java -cp build/ast JavaAstAudit src/main/java
          java -cp build/ast JavaAstAudit build/${{ matrix.profile }}/generated
      - name: Verify reproducible JAR bytes
        run: |
          sha256sum dist/*.jar > build/before.sha256
          python3 tools/build.py --profile '${{ matrix.profile }}'
          sha256sum -c build/before.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mgfsr3bridge-${{ matrix.profile }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
